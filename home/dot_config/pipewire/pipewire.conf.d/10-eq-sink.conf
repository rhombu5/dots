# Virtual sink that applications target when their audio should be processed
# by an external plugin host (Carla) before reaching the hardware device.
#
# Nothing auto-connects the monitor ports to hardware — Carla owns that link.
# With Carla not running, this sink is a black hole by design.
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "eq-in"
            node.description        = "EQ"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            monitor.passthrough     = true
        }
    }
]
