# Glitch resilience under system load. This is a listening machine, not a
# pro-audio box: nothing here needs sub-10ms latency, so keep any single
# latency-hungry client from dragging the shared graph quantum down to
# fragile sub-millisecond buffers (stock floor is 32 samples = 0.7ms).
context.properties = {
    default.clock.min-quantum = 512    # ~10.7ms floor at 48kHz
    default.clock.quantum     = 1024   # ~21ms default
    default.clock.max-quantum = 8192   # ~170ms ceiling for big-buffer clients
}
