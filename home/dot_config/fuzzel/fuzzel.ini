# fuzzel — app launcher + dmenu host (clipboard picker, control panel,
# emoji picker, etc.).
#
# Colors split across two files:
#   ~/.config/themes/static.ini  chezmoi-managed, never regenerated
#   ~/.config/themes/accent.ini  matugen on full regen
# fuzzel re-reads its config on every launch — no live reload needed.

include=~/.config/themes/static.ini
include=~/.config/themes/accent.ini

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
show-actions=no
list-executables-in-path=no
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=4
line-height=24
letter-spacing=0
tabs=8
exit-on-keyboard-focus-loss=yes
match-counter=no
filter-desktop=no
# `match-mode` (exact|fuzzy|fzf) supersedes the old `fuzzy=` boolean
# (per fuzzel.ini(5), current docs do not list fuzzy=).
match-mode=fzf

[dmenu]
exit-immediately-if-empty=no
mode=text

[key-bindings]
cancel=Escape Control+g Control+c
execute=Return KP_Enter Control+y
execute-or-next=Tab
delete-prev=BackSpace Control+h
delete-prev-word=Mod1+BackSpace Control+w
delete-next=Delete Control+d
prev=Up Control+p
next=Down Control+n
first=Control+Home
last=Control+End

# Border config (radius/width come from colors.ini matugen output)
