# Force PCM on the built-in HDMI sink — no Dolby bitstream passthrough.
#
# ALSA derives the IEC958 codec list from the HDMI ELD the display reports,
# and the Vizio on DP-1 claims AC3 + EAC3. Nothing verifies the claim, so any
# player that probes for passthrough takes it: VLC negotiates
# 'eac3'->'spdi' on a Dolby Digital Plus track and ships the raw compressed
# frames instead of decoding them. What reaches the speakers is unrecognisable
# noise, with the audio thread flushing buffers every few seconds (55x
# "playback way too late" in a 25s sample) and dragging the video clock with it.
#
# Clearing the codec list makes the sink PCM-only, so players decode Dolby in
# software and downmix to the stereo profile (51-default-profile.conf) like any
# other track. Fixing it here covers every application at once — VLC's own
# spdif=0 preference loses to the sink negotiation, so a per-app setting can't.
#
# Revert this file if the HDMI chain is ever set up for real surround
# passthrough (needs a working ELD and an hdmi-surround profile, not stereo).

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        iec958.codecs = [ ]
      }
    }
  }
]
