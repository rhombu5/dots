# Match-by-PCI-address scopes this rule to this laptop only.
# State-file-stored profile choices still win over this default.

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        priorities = [ "output:hdmi-stereo+input:analog-stereo" ]
      }
    }
  }
]
