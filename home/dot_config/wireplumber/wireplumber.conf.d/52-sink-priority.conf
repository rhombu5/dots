# Default-sink selection, not profile selection (that's 51-default-profile.conf).
#
# The DisplayLink dock exposes an S/PDIF sink that is always "available" even
# with nothing wired to it, and it outranked the laptop's HDMI sink on stock
# priorities — so audio silently went to a dead digital port whenever
# wireplumber re-picked a default (fresh state, re-dock, reboot).
#
# Raise the built-in HDMI sink and sink the dock's S/PDIF well below it.
# The dock sink stays selectable by hand; it just never wins automatically.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-DisplayLink.*iec958-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
