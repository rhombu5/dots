# matugen pipeline — generates Material You palette from current wallpaper
# and renders templates to all theme-aware components.
#
# Invoked by ~/.local/bin/theme-toggle and ~/.local/bin/wallpaper-rotate.
# Manual run: matugen image ~/Pictures/Wallpapers/<file>.{jpg,png}

[config]
# We drive reloads from theme-toggle directly so each template's hook is optional.
reload_apps = false
custom_colors = {}

# ---- Component templates ----

# --- Shared accent (waybar + swaync + fuzzel + Hyprland borders/groupbar) ---
# These three writes go to ~/.config/themes/accent.{css,conf,ini}. matugen
# (slow path) gives the M3 palette to all the static themes; per-workspace
# accent push is owned by hyprmural's accent.py hook, which writes per-output
# colors to $XDG_RUNTIME_DIR/hyprmural/accent-<mon>.rgb and pushes them live
# via `hyprctl setprop ... bordercolor` per-window.
# Reload coalescing: a single matugen run touches both `shared-accent-css`
# and `shared-accent-conf`. The conf hook's `hyprctl reload` triggers
# exec.conf's `exec = pkill -SIGUSR2 waybar` line, which is the one
# waybar reload per rotation we want — so neither hook here sends
# SIGUSR2 directly. The css hook still reloads swaync (no piggyback).
[templates.shared-accent-css]
input_path = "~/.config/matugen/templates/shared-accent.css"
output_path = "~/.config/themes/accent.css"
post_hook = "swaync-client --reload-css 2>/dev/null || true"

# hypr-plugins-on-login is owned by hypr-plugins-on-login.service (one-shot
# at session start); on every hyprctl reload, hypr-plugins-resource-binds
# (exec.conf §5) re-sources post-plugin binds. Don't re-call the on-login
# script here — the `hyprpm reload` inside it fires a second waybar
# reload, breaking the one-blink invariant.
[templates.shared-accent-conf]
input_path = "~/.config/matugen/templates/shared-accent.conf"
output_path = "~/.config/themes/accent.conf"
post_hook = "hyprctl reload 2>/dev/null || true"

[templates.shared-accent-ini]
input_path = "~/.config/matugen/templates/shared-accent.ini"
output_path = "~/.config/themes/accent.ini"
# fuzzel re-reads on every launch; no reload hook needed.

[templates.ghostty]
input_path = "~/.config/matugen/templates/ghostty-theme"
output_path = "~/.config/ghostty/themes/matugen"
# Ghostty config references theme = matugen; live reload via SIGUSR2.
post_hook = "pkill -SIGUSR2 ghostty 2>/dev/null || true"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock.colors.conf"
# hyprlock reads on launch; no reload needed.

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt5]
input_path = "~/.config/matugen/templates/qt.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6]
input_path = "~/.config/matugen/templates/qt.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.zathura]
input_path = "~/.config/matugen/templates/zathurarc"
# Render to a sidecar file that the chezmoi-managed `zathurarc` pulls in via
# zathura's `include` directive (zathurarc(5)). Avoids the stomp where matugen
# and chezmoi both wrote to ~/.config/zathura/zathurarc.
output_path = "~/.config/zathura/colors.zathurarc"

[templates.helix]
input_path = "~/.config/matugen/templates/helix.toml"
output_path = "~/.config/helix/themes/matugen.toml"

# tmux gets its own color file sourced by ~/.tmux.conf. The post_hook
# re-sources the parent file in every running tmux session so a wallpaper
# change updates colors immediately (no detach/reattach).
[templates.tmux]
input_path = "~/.config/matugen/templates/tmux-colors.conf"
output_path = "~/.config/tmux/colors.conf"
post_hook = "tmux list-sessions >/dev/null 2>&1 && tmux source-file ~/.tmux.conf 2>/dev/null || true"

# Greeter CSS: rendered to user cache; postinstall installs to /etc/greetd/
# during reinstall. Live theme-following for the greeter is deferred (would
# require a polkit rule for the cp; greeter is only seen at cold boot anyway).
[templates.regreet]
input_path = "~/.config/matugen/templates/regreet.css"
output_path = "~/.cache/matugen/regreet.css"
