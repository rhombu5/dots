[tools]
bun = "1.3.14"
node = "lts"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@fnclaude/cli" = "2.15.1"
"npm:@openai/codex" = "latest"
"npm:@typescript/native-preview" = "beta"
"npm:tree-sitter-cli" = "latest"
"pipx:homeassistant-cli" = "latest"
uv = "latest"

[settings]
experimental = true
# Auto-trust any mise.toml beneath these roots, so new clones and worktrees do not
# need a manual `mise trust` before their tools resolve.
trusted_config_paths = ["~/src", "~/.local/src"]

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true
