# wpws — per-workspace wallpaper + dynamic accent for Hyprland.
#
# Config schema is intentionally tiny — anything not set falls back to
# the daemon's defaults (see ~/.local/bin/wpws). Keep it that way; this
# is config, not API.

[pool]
# Directory of wallpaper files. Sorted alphabetically; workspace N maps to
# pool[(N - 1 + offset) % len(pool)]. Tilde and $HOME expanded.
dir = "~/.local/share/wallpapers"

# File extensions considered. Case-insensitive.
extensions = [".jpg", ".jpeg", ".png", ".webp"]

# Subset used when stitching the wide canvas (`wpws stitch`). When set,
# only these wallpapers are concatenated into the panning canvas; the
# full `pool` is still available for accent extraction and matugen seeds.
# Filenames are relative to `pool.dir`. Order here = canvas slot order.
picks = [
  "arch_logo_abstract_bluegreen.jpg",
  "arch_logo_on_lightblue.png",
  "archlinux_over_mountains.png",
  "i_use_arch_btw-logo.png",
  "linux_godfather.jpg",
  "linux_on_a_clif.jpg",
  "linux_terminal_wallpaper.png",
  "makepkg_not_war.webp",
  "rmrf_fixes_all.jpg",
]

[targets]
# Where to write the dynamic theme files. Consumers should @import / source /
# include accent.css/.conf/.ini under this directory.
themes_dir = "~/.config/themes"

[reload]
# Best-effort post-update hooks. Each runs in a shell. Failures are silent.
hooks = [
  "pkill -SIGUSR2 waybar 2>/dev/null || true",
  "swaync-client --reload-css 2>/dev/null || true",
]

[debounce]
# Minimum seconds between accent updates when workspace events stack up
# (rapid Super+1, Super+2, ... presses).
min_interval_seconds = 0.05
