# Keybinds — rich custom set per docs/desktop-requirements.md.
# Validator at ~/.local/bin/validate-hypr-binds catches duplicate (MOD, KEY)
# pairs and unknown dispatchers. Cheat sheet at runbook/keybinds.md is
# auto-regenerated from this file.
#
# Convention: SUPER (Mod4) is the primary modifier. SUPER+CTRL for
# destructive / system-level actions. SUPER+SHIFT for less-common nav.
#
# Every entry uses `bindd` (or its variants binddl / binddel / bindde /
# binddm) — bind-with-description. The description shows up in
# `hyprctl binds -j` as the `description` field, and the
# ~/.local/bin/hypr-cheatsheet popup renders it instead of the raw
# dispatcher+args. New bindings WITHOUT a description are still legal
# (use bare `bind`) but the cheatsheet will show "—" for them.

# === App quicklaunches ========================================================
# Each long-running app launches via `uwsm app -a NAME -- ...` so it lands in
# its own app-NAME-<random>.scope under app-graphical.slice — gives systemd-oomd
# a per-app kill target instead of forcing it to SIGKILL the whole compositor
# cgroup under memory pressure. See exec.conf §4 for the full rationale.
# Short-lived pickers (fuzzel below) stay bare — they exit before a scope is
# even worth creating.
bindd = $mainMod, Return,   Open terminal,                exec, uwsm app -a ghostty -- ghostty
bindd = $mainMod, KP_Enter, Open terminal (numpad),       exec, uwsm app -a ghostty -- ghostty
bindd = $mainMod, B,        Open browser,                 exec, uwsm app -a google-chrome -- google-chrome-stable
bindd = $mainMod ALT, B,    Open browser (debug logging), exec, uwsm app -a microsoft-edge-stable -- sh -c 'exec microsoft-edge-stable --enable-logging=stderr --v=1 --password-store=basic >"$HOME/.local/state/edge-debug.log" 2>&1'
bindd = $mainMod SHIFT, B,      Open browser (GPU off),         exec, uwsm app -a microsoft-edge-stable -- microsoft-edge-stable --disable-gpu
bindd = $mainMod SHIFT ALT, B,  Open browser (debug + GPU off), exec, uwsm app -a microsoft-edge-stable -- sh -c 'exec microsoft-edge-stable --enable-logging=stderr --v=1 --password-store=basic --disable-gpu >"$HOME/.local/state/edge-debug.log" 2>&1'
bindd = $mainMod CTRL, B,            Open browser inprivate,                   exec, uwsm app -a microsoft-edge-stable -- microsoft-edge-stable --inprivate
bindd = $mainMod CTRL ALT, B,        Open browser inprivate (debug),           exec, uwsm app -a microsoft-edge-stable -- sh -c 'exec microsoft-edge-stable --enable-logging=stderr --v=1 --password-store=basic --inprivate >"$HOME/.local/state/edge-debug.log" 2>&1'
bindd = $mainMod CTRL SHIFT, B,      Open browser inprivate (GPU off),         exec, uwsm app -a microsoft-edge-stable -- microsoft-edge-stable --disable-gpu --inprivate
bindd = $mainMod CTRL SHIFT ALT, B,  Open browser inprivate (debug + GPU off), exec, uwsm app -a microsoft-edge-stable -- sh -c 'exec microsoft-edge-stable --enable-logging=stderr --v=1 --password-store=basic --disable-gpu --inprivate >"$HOME/.local/state/edge-debug.log" 2>&1'
bindd = $mainMod, C,        Open Claude in terminal,      exec, uwsm app -a claude -- ghostty -e claude --dangerously-skip-permissions --chrome --brief
bindd = $mainMod, E,        Open code editor,             exec, uwsm app -a code -- code
bindd = $mainMod, F,        Open file manager,            exec, uwsm app -a nautilus -- nautilus
bindd = $mainMod, I,        Open Bitwarden,               exec, uwsm app -a bitwarden-desktop -- bitwarden-desktop
bindd = $mainMod, Y,        Open yazi (TUI files),        exec, uwsm app -a yazi -- ghostty -e yazi
bindd = $mainMod, Space,    Open app launcher,            exec, fuzzel

# === Pickers + utilities ======================================================
bindd = $mainMod, V,         Clipboard history picker,     exec, cliphist list | fuzzel --dmenu --width 60 | cliphist decode | wl-copy
bindd = $mainMod, P,         Color picker (eyedropper),    exec, hyprpicker -an
bindd = $mainMod, comma,     Open control panel,           exec, ~/.local/bin/control-panel
bindd = $mainMod, N,         Toggle notification center,   exec, swaync-client -t -sw
bindd = $mainMod, semicolon, Emoji picker (copies to clipboard), exec, bemoji
bindd = $mainMod, slash,     Show keybinds cheatsheet,     exec, ~/.local/bin/hypr-cheatsheet

# === Window management ========================================================
bindd = $mainMod,        Q,   Close active window,           killactive
bindd = $mainMod CTRL,  Q,   Logout / shutdown menu,        exec, systemd-cat -t hibernate-bind sh -c 'echo "super+ctrl+q chord fired (wleave menu)"; exec wleave'
bindd = $mainMod,        T,   Toggle tiled / floating,       togglefloating
bindd = $mainMod,        M,   Toggle horizontal / vertical split, layoutmsg, togglesplit
bindd = $mainMod,        U,   Maximize (no bar),             fullscreen, 1
bindd = $mainMod,        F11, Fullscreen (true),             fullscreen, 0
bindd = $mainMod CTRL,  P,   Pin floating window (sticky),  pin
bindd = $mainMod,        G,   Layout: Mode: toggle grouping,     togglegroup
bindd = $mainMod,        bracketright, Layout: Focus: Tabs: next,     changegroupactive, f
bindd = $mainMod,        bracketleft,  Layout: Focus: Tabs: previous, changegroupactive, b

# === Layouts (workspace-wide) =================================================
# Per-window toggles above (Super+T floating, Super+G group/tabs) flip just
# the focused window. These workspace-wide flavors hit every window in the
# active workspace — useful for switching the whole layout at once.
bindd = $mainMod ALT, T, Layout: Misc: tile all windows (dwindle),  exec, ~/.local/bin/hypr-layout-tiling
bindd = $mainMod ALT, F, Layout: Misc: float all windows,           exec, ~/.local/bin/hypr-layout-floating
bindd = $mainMod ALT, Tab, Layout: Misc: tab all windows,           exec, ~/.local/bin/hypr-layout-tabbed
bindd = $mainMod ALT, S, Layout: Mode: toggle scrolling (dwindle <-> scrolling), exec, ~/.local/bin/hypr-layout-toggle
# Scrolling-layout-specific bindings (move/colresize/promote/swapcol/togglefit)
# live in post-plugins.d/hyprscrolling.conf — sourced at runtime by
# hypr-plugins-on-login AFTER `hyprpm enable hyprscrolling` succeeds, so
# Hyprland's initial config parse doesn't see layoutmsg references for an
# unloaded layout.

# Theme + system
bindd = $mainMod CTRL,  T,   Cycle dark/light theme,        exec, ~/.local/bin/theme-toggle
bindd = $mainMod ALT,   H,   Hibernate the system,          exec, systemd-cat -t hibernate-bind sh -c 'echo "super+alt+h chord fired"; systemctl hibernate; echo "systemctl hibernate exit=$?"'
bindd = $mainMod ALT,   L,   Lock the screen,               exec, loginctl lock-session
bindd = $mainMod CTRL,  R,   Reload Hyprland + waybar,      exec, hyprctl reload && pkill -SIGRTMIN+8 waybar
# Ghostty runs every window in one process, so there is no pid to resolve the
# focused window to its pty — this repaints every session. Harmless: Ink only
# re-renders when the width it reads differs from the width it holds, so a
# healthy session ignores the signal and a desynced one redraws.
bindd = $mainMod SHIFT, R,   Repaint Claude Code TUIs,      exec, pkill -WINCH -x claude
bindd = $mainMod SHIFT, W,   Reshuffle hyprmural wallpapers,             exec, systemctl --user kill -s SIGUSR1 hyprmural.service
bindd = $mainMod CTRL,  W,   Toggle waybar (relaunch on crash recovery), exec, ~/.local/bin/hypr-panel-toggle
# Full process restart — resyncs the workspace-taskbar pills (waybar's
# hyprland/workspaces taskbar doesn't refresh on window open/close/title
# events, upstream #4308 + open/close gap) and clears the GTK event-loop
# wedge where clicks die but the bar still renders. Neither CTRL+R (only
# pokes the theme-toggle module via SIGRTMIN+8) nor CTRL+W (SIGUSR1
# visibility toggle) rebuilds the bar in the visible-but-stale state.
bindd = $mainMod CTRL SHIFT, W, Restart waybar (resync pills / unwedge clicks), exec, systemctl --user restart waybar.service
# Manual override for the auto tablet-mode detection (intel_vbtn → udev →
# user systemd path unit). Useful if the auto-detect ever misfires —
# forces a flip regardless of sensor state.
bindd = $mainMod ALT,    K,   Layout: Mode: toggle tablet mode (manual override), exec, ~/.local/bin/tablet-mode-toggle --toggle

# === Focus ====================================================================
# Left/right are edge-aware: at the workspace edge they escalate to the next
# workspace and focus the leftmost (going right) or rightmost (going left)
# window there. Up/down keep the plain dispatcher — no vertical "edge to next
# workspace" semantic.
bindd = $mainMod, left,  Layout: Focus: Window: left (edge -> prev workspace),  exec, ~/.local/bin/hypr-edge-nav focus l
bindd = $mainMod, right, Layout: Focus: Window: right (edge -> next workspace), exec, ~/.local/bin/hypr-edge-nav focus r
bindd = $mainMod, up,    Layout: Focus: Window: up,      movefocus, u
bindd = $mainMod, down,  Layout: Focus: Window: down,    movefocus, d
bindd = $mainMod, h,     Layout: Focus: Window: left vim (edge -> prev workspace),  exec, ~/.local/bin/hypr-edge-nav focus l
bindd = $mainMod, l,     Layout: Focus: Window: right vim (edge -> next workspace), exec, ~/.local/bin/hypr-edge-nav focus r
bindd = $mainMod, k,     Layout: Focus: Window: up (vim),      movefocus, u
bindd = $mainMod, j,     Layout: Focus: Window: down (vim),    movefocus, d

# === Move window ==============================================================
# Left/right are edge-aware: at the workspace edge they escalate to
# move-and-follow into the next/prev workspace. Up/down stay plain.
bindd = $mainMod CTRL, left,  Layout: Move: Window: left (edge -> prev workspace + follow),  exec, ~/.local/bin/hypr-edge-nav move l
bindd = $mainMod CTRL, right, Layout: Move: Window: right (edge -> next workspace + follow), exec, ~/.local/bin/hypr-edge-nav move r
bindd = $mainMod CTRL, up,    Layout: Move: Window: up,      movewindow, u
bindd = $mainMod CTRL, down,  Layout: Move: Window: down,    movewindow, d
bindd = $mainMod CTRL, h,     Layout: Move: Window: left vim (edge -> prev workspace + follow),  exec, ~/.local/bin/hypr-edge-nav move l
bindd = $mainMod CTRL, l,     Layout: Move: Window: right vim (edge -> next workspace + follow), exec, ~/.local/bin/hypr-edge-nav move r
bindd = $mainMod CTRL, k,     Layout: Move: Window: up (vim),      movewindow, u
bindd = $mainMod CTRL, j,     Layout: Move: Window: down (vim),    movewindow, d

# === Resize submap ============================================================
bindd = $mainMod, R, Toggle resize mode (Super+R/Esc/Enter exits), exec, ~/.local/bin/hypr-resize-mode on
submap = resize
bindde = , left,  Layout: Resize: -20px wide,  resizeactive, -20 0
bindde = , right, Layout: Resize: +20px wide,  resizeactive,  20 0
bindde = , up,    Layout: Resize: -20px tall,  resizeactive,   0 -20
bindde = , down,  Layout: Resize: +20px tall,  resizeactive,   0  20
bindde = , h,     Layout: Resize: -20px wide (vim),  resizeactive, -20 0
bindde = , l,     Layout: Resize: +20px wide (vim),  resizeactive,  20 0
bindde = , k,     Layout: Resize: -20px tall (vim),  resizeactive,   0 -20
bindde = , j,     Layout: Resize: +20px tall (vim),  resizeactive,   0  20
bindd  = $mainMod, R, Exit resize mode (toggle off), exec, ~/.local/bin/hypr-resize-mode off
bindd  = , Return, Exit resize mode, exec, ~/.local/bin/hypr-resize-mode off
bindd  = , Escape, Exit resize mode, exec, ~/.local/bin/hypr-resize-mode off
submap = reset

# === Workspaces (static, monitor-bound) =======================================
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Toggle workspace-8 overlay, togglespecialworkspace, ws8
bindd = $mainMod, 9, Toggle workspace-9 overlay, togglespecialworkspace, ws9
bindd = $mainMod, 0, Toggle scratchpad workspace, togglespecialworkspace, scratch

bindd = $mainMod ALT, 1, Move window -> workspace 1, movetoworkspacesilent, 1
bindd = $mainMod ALT, 2, Move window -> workspace 2, movetoworkspacesilent, 2
bindd = $mainMod ALT, 3, Move window -> workspace 3, movetoworkspacesilent, 3
bindd = $mainMod ALT, 4, Move window -> workspace 4, movetoworkspacesilent, 4
bindd = $mainMod ALT, 5, Move window -> workspace 5, movetoworkspacesilent, 5
bindd = $mainMod ALT, 6, Move window -> workspace 6, movetoworkspacesilent, 6
bindd = $mainMod ALT, 7, Move window -> workspace 7, movetoworkspacesilent, 7
bindd = $mainMod ALT, 8, Move window -> workspace-8 overlay, movetoworkspacesilent, special:ws8
bindd = $mainMod ALT, 9, Move window -> workspace-9 overlay, movetoworkspacesilent, special:ws9
bindd = $mainMod ALT, 0, Move window -> scratchpad, movetoworkspacesilent, special:scratch

# Move-and-follow: send the focused window to a workspace AND switch to it.
# `movetoworkspace` (without the silent suffix) does both in one dispatcher.
bindd = $mainMod CTRL, 1, Move window -> workspace 1 + follow, movetoworkspace, 1
bindd = $mainMod CTRL, 2, Move window -> workspace 2 + follow, movetoworkspace, 2
bindd = $mainMod CTRL, 3, Move window -> workspace 3 + follow, movetoworkspace, 3
bindd = $mainMod CTRL, 4, Move window -> workspace 4 + follow, movetoworkspace, 4
bindd = $mainMod CTRL, 5, Move window -> workspace 5 + follow, movetoworkspace, 5
bindd = $mainMod CTRL, 6, Move window -> workspace 6 + follow, movetoworkspace, 6
bindd = $mainMod CTRL, 7, Move window -> workspace 7 + follow, movetoworkspace, 7
bindd = $mainMod CTRL, 8, Move window -> workspace-8 overlay + follow, movetoworkspace, special:ws8
bindd = $mainMod CTRL, 9, Move window -> workspace-9 overlay + follow, movetoworkspace, special:ws9
bindd = $mainMod CTRL, 0, Move window -> scratchpad + follow, movetoworkspace, special:scratch

bindd = $mainMod CTRL, left,  Move window -> previous workspace + follow, movetoworkspace, e-1
bindd = $mainMod CTRL, right, Move window -> next workspace + follow,     movetoworkspace, e+1

bindd = $mainMod, Tab, Switch to last workspace, workspace, previous

# Workspace overview (Hyprspace) lives in post-plugins.d/hyprspace.conf
# — sourced at runtime by the hyprpm bootstrap dispatcher AFTER the
# plugin loads, so the initial Hyprland config parse never sees the
# unknown 'overview:toggle' dispatcher and doesn't raise the sticky red
# error overlay.

# === Mouse ====================================================================
binddm = $mainMod, mouse:272, Layout: Move: drag to move,        movewindow
binddm = $mainMod, mouse:273, Layout: Resize: drag to resize,    resizewindow
bindd  = $mainMod, mouse_up,   Switch to next workspace,     workspace, e+1
bindd  = $mainMod, mouse_down, Switch to previous workspace, workspace, e-1

# === Media keys (SwayOSD wraps these so the popup shows the new level) ========
binddel = ,XF86AudioRaiseVolume,  Volume up,                   exec, swayosd-client --output-volume raise
binddel = ,XF86AudioLowerVolume,  Volume down,                 exec, swayosd-client --output-volume lower
binddel = ,XF86AudioMute,         Mute / unmute output,        exec, swayosd-client --output-volume mute-toggle
binddel = ,XF86AudioMicMute,      Mute / unmute mic,           exec, swayosd-client --input-volume mute-toggle
binddel = ,XF86MonBrightnessUp,   Brightness up,               exec, swayosd-client --brightness raise
binddel = ,XF86MonBrightnessDown, Brightness down,             exec, swayosd-client --brightness lower
binddl =  ,XF86AudioPlay,         Play / pause media,          exec, playerctl play-pause
binddl =  ,XF86AudioNext,         Next track,                  exec, playerctl next
binddl =  ,XF86AudioPrev,         Previous track,              exec, playerctl previous

# === Lid switch ===============================================================
# Lid behavior lives here in the Hyprland session; logind defers entirely
# (/etc/systemd/logind.conf.d/10-lid.conf, Handle*=ignore). On close,
# ~/.local/bin/lid-handler disables eDP-1 if an external monitor is attached
# (re-enabled on open), then runs the system hibernate-check. Hibernate fires
# only when lid-closed AND no external connected AND on battery — see the
# headless-hibernate condition script (arch-setup postinstall 1h-bat).
binddl = , switch:on:Lid Switch,  Lid close: eDP-1 off if docked + hibernate check, exec, ~/.local/bin/lid-handler close
binddl = , switch:off:Lid Switch, Lid open: re-enable eDP-1,                        exec, ~/.local/bin/lid-handler open

# === Screenshots (saved to ~/pics/Screenshots/ — XDG pictures dir) ============
bindd = ,        Print, Screenshot region,                exec, hyprshot -m region -o ~/pics/Screenshots
bindd = ALT,     Print, Screenshot active window,         exec, hyprshot -m window -o ~/pics/Screenshots
bindd = CTRL,    Print, Screenshot full screen (output),  exec, hyprshot -m output -o ~/pics/Screenshots
bindd = $mainMod, Print, Screenshot region -> annotate (satty), exec, hyprshot -m region --raw | satty --filename - --output-filename ~/pics/Screenshots/satty-$(date +%FT%H%M%S).png
