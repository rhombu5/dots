# Clamshell override for eDP-1. Generated by ~/.local/bin/hypr-lid-sync
# on every lid event and at session start; sourced from hyprland.conf
# AFTER monitors.conf so its eDP-1 rule wins on reload. Do not edit by
# hand.
#
# `create_` chezmoi prefix means chezmoi apply only writes this file if
# it doesn't already exist — runtime rewrites (by hypr-lid-sync) survive.
