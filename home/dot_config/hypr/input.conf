# Input — keyboard, touchpad, touch, tablet.

input {
    kb_layout  = us
    kb_options = compose:ralt
    repeat_rate  = 40
    repeat_delay = 250

    # NumLock on by default (numpad types digits, not navigation arrows).
    # Hyprland default is false, which leaves the numpad in arrow-key mode
    # and made every boot feel "wrong". Flip to false here if you'd rather
    # NumLock be off by default.
    numlock_by_default = true

    # follow_mouse: 0 = click-to-focus, 1 = full FFM, 2 = loose follow, 3 = sloppy/no follow.
    #
    # With 0, scroll-wheel events only go to the WINDOW THAT HAS POINTER FOCUS,
    # which only changes on click (per InputManager.cpp::onMouseWheel — Hyprland
    # only re-warps pointer focus to the under-cursor surface when follow_mouse=1).
    # That makes scrolling on a non-focused window feel broken: hover ≠ scroll target.
    #
    # 1 fixes the scroll-under-cursor case (Hyprland calls simulateMouseMovement()
    # before each scroll if PWINDOW != PCURRWINDOW), but also makes hover steal
    # keyboard focus — disruptive when typing.
    #
    # 2 (loose) is the compromise: pointer focus follows mouse so scroll lands on
    # the under-cursor surface, but keyboard focus is decoupled — text input keeps
    # going to the last-clicked window.
    follow_mouse = 2
    mouse_refocus = false     # don't auto-refocus keyboard when re-entering a window

    accel_profile = adaptive

    touchpad {
        natural_scroll      = false
        tap-to-click        = true
        tap-and-drag        = true
        clickfinger_behavior = true
        scroll_factor       = 0.4
        disable_while_typing = true
    }

    touchdevice {
        enabled = true
    }

    tablet {
        # Wacom AES digitizer — bound to the internal panel; rotation follows iio.
        output = eDP-1
    }
}

gestures {
    # Hyprland removed `workspace_swipe` and `workspace_swipe_fingers` in favor of
    # the new gestures system (wiki Variables.md gestures section, explicit NOTE).
    # Replacement: a top-level `gesture = N, DIRECTION, ACTION` keyword.
    # `workspace_swipe_invert` and `workspace_swipe_min_speed_to_force` are still valid.
    workspace_swipe_invert             = true
    workspace_swipe_min_speed_to_force = 5
}

# Touch gestures (TOUCHPAD only; touchscreen is hyprgrass — see post-plugins.d/).
#   - 4-finger horizontal: animated workspace swipe (live-tracks like the old
#     workspace_swipe). `workspace_swipe_invert` + `_min_speed_to_force` above
#     apply to this binding.
#   - 3-finger l/r: discrete browser back/forward via wtype Alt+Left/Right.
#     wtype emits Wayland virtual_keyboard_v1 keystrokes into the focused
#     window; Alt+arrow is the cross-app back/forward shortcut (browsers,
#     IDEs, file managers) — XF86Back/Forward fallback exists if needed.
gesture = 4, horizontal, workspace
gesture = 3, l, dispatcher, exec, wtype -M alt -k Left -m alt
gesture = 3, r, dispatcher, exec, wtype -M alt -k Right -m alt

cursor {
    inactive_timeout = 5
    no_warps         = true
    persistent_warps = true
}

# hyprgrass touch-gesture config lives in post-plugins.conf — sourced
# at runtime by the hyprpm bootstrap planter AFTER the plugin loads.
# See plugins.conf for the rationale.
