# Borders + group/tab styling. Uses vars defined by static.conf and accent.conf
# (sourced earlier in hyprland.conf). Per-window border colors are pushed live
# by hyprmural's accent.py hook (`hyprctl setprop ... bordercolor` per client)
# so each output's border tracks its own workspace's wallpaper.

general {
    col.active_border   = $primary $tertiary 45deg
    col.inactive_border = $outline
}

decoration {
    shadow {
        color = rgba(000000aa)
    }
}

# Window grouping — Super+G toggles. Make tabs legible by default: solid fill,
# accent on active, neutral surface on inactive, M+ font, decent height.
group {
    col.border_active          = $primary $tertiary 45deg
    col.border_inactive        = $outline_variant
    col.border_locked_active   = $error
    col.border_locked_inactive = $outline_variant

    groupbar {
        enabled       = true
        font_family   = JetBrainsMono Nerd Font
        font_size     = 11
        height        = 22
        gradients     = true
        text_color    = $on_primary_container
        col.active            = $primary_container
        col.inactive          = $surface_container
        col.locked_active     = $error
        col.locked_inactive   = $surface_container
        render_titles = true
        scrolling     = true
    }
}
