# Workspaces — static + monitor-bound per docs/desktop-requirements.md.
# 1-5 → DP-1 (external Vizio, primary at the desk)
# 6-7 → eDP-1 (internal panel)
# Each eDP-1 workspace has DP-1 as fallback so they migrate cleanly when
# the lid closes (post-battery-replacement; harmless dead path today).
# 8, 9, and 'scratch' are special (overlay) workspaces, summoned wherever
# (Super+8/9/0) — they float on top of whatever's active rather than
# tiling into the normal 1-7 rotation. Rules in binds.conf. There are
# deliberately NO numeric 8/9 workspaces; the bar's 8/9/0 pills ARE these
# three (waybar's persistent-workspaces lists them by name).

workspace = 1, monitor:DP-1,  default:true, persistent:true
workspace = 2, monitor:DP-1,                persistent:true
workspace = 3, monitor:DP-1,                persistent:true
workspace = 4, monitor:DP-1,                persistent:true
workspace = 5, monitor:DP-1,                persistent:true

workspace = 6, monitor:eDP-1, default:true, persistent:true
workspace = 7, monitor:eDP-1,               persistent:true

# Special workspaces — toggled with Super+8/9/0; rules in binds.conf.
# ws8/ws9 pin to eDP-1 so they surface on the internal panel regardless of
# which monitor currently has focus.
#
# Each carries an on-created-empty default, so first summon lands on a
# ready app rather than an empty overlay: Super+0 a scratch browser
# window, Super+8 the Messages PWA, Super+9 the YouTube Music PWA.
# Nothing is spawned until the workspace is first summoned.
#
# Deliberately NOT floated: a floating window ignores the layout entirely,
# so Super+Alt+S (dwindle<->scrolling) can't touch it and a Super+Return
# terminal tiles fullscreen *behind* it instead of splitting with it.
# Tiled and alone on the workspace, the window already fills the screen.
#
# The PWAs are launched by --app-id rather than via their .desktop files
# so the uwsm app scope name is ours to choose (see exec.conf §4 for why
# every long-running app gets its own scope). App IDs come from
# ~/.local/share/applications/chrome-<id>-Default.desktop.
workspace = special:ws8, monitor:eDP-1, on-created-empty:uwsm app -a chrome-messages -- google-chrome-stable --profile-directory=Default --app-id=hpfldicfbfomlpcikngkocigghgafkph
workspace = special:ws9, monitor:eDP-1, on-created-empty:uwsm app -a chrome-ytmusic -- google-chrome-stable --profile-directory=Default --app-id=cinhimbnkkaeohfgghhklpknlkffjgod
workspace = special:scratch, on-created-empty:uwsm app -a chrome -- google-chrome-stable --new-window
