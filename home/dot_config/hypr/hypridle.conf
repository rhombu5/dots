# hypridle — idle action daemon. 30-min lock + DPMS-off per
# docs/desktop-requirements.md. No idle-hibernate (user invokes manually
# via Super+Shift+H or fuzzel control-panel).

general {
    # Lock via btop-lock — kmscon launches on a free TTY at 4K with a 32px
    # font; renders btop running as a non-privileged `lockuser`; any keypress
    # drops to a password prompt (pamtester against /etc/pam.d/btop-lock,
    # password-only — fingerprint+PIN stay with physlock for in-person use).
    # On auth success the outer wrapper chvts back to Hyprland's tty, which
    # has been running undisturbed the whole time.
    # See `phase-3-arch-postinstall/postinstall.sh` §1g in arch-setup for
    # the install. Emergency recovery if wedged: `sudo escape-lock` from
    # SSH on a phone (NOPASSWD'd in /etc/sudoers.d/btop-lock).
    # Replaced physlock 2026-05-11 to make the lockscreen actually useful —
    # at-a-distance system stats instead of a blank prompt.
    #
    # `pidof btop-lock` guard prevents stacking lockscreens if hypridle
    # re-fires before the user has unlocked. The `sudo` is silent because
    # the sudoers entry NOPASSWD's it for tom.
    # unlock_cmd dispatches dpms on because btop-lock takes input on a
    # different VT — Hyprland never sees the unlock, so the DPMS listener's
    # on-resume never fires. Without this, displays stay blanked after
    # unlock until something else (e.g. lid event) reconfigures monitors.
    # The 0.5s sleep gives Hyprland time to reacquire DRM master after the
    # outer btop-lock's `chvt 1` — without it, hyprctl can race the handoff
    # and dpms-on no-ops, leaving the TV showing "no signal" until input.
    lock_cmd            = pidof btop-lock || sudo /usr/local/bin/btop-lock
    unlock_cmd          = sleep 0.5; hyprctl dispatch dpms on; notify-send -t 1500 "unlocked"
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = hyprctl dispatch dpms on
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# 28 min idle → display power off (saves a couple minutes of backlight before lock)
listener {
    timeout       = 1680
    on-timeout    = hyprctl dispatch dpms off
    on-resume     = hyprctl dispatch dpms on
}

# 30 min idle → screen lock
listener {
    timeout       = 1800
    on-timeout    = loginctl lock-session
}
