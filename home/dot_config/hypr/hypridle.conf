# hypridle — idle action daemon. 30-min lock + DPMS-off per
# docs/desktop-requirements.md. No idle-hibernate (user invokes manually
# via Super+Shift+H or fuzzel control-panel).

general {
    # Lock via btop-lock — kmscon launches on a free TTY at 4K with a 32px
    # font; renders btop running as a non-privileged `lockuser`; any keypress
    # drops to a password prompt (pamtester against /etc/pam.d/btop-lock,
    # password-only — fingerprint+PIN stay with physlock for in-person use).
    # On auth success the outer wrapper chvts back to Hyprland's tty, which
    # has been running undisturbed the whole time.
    # See `phase-3-arch-postinstall/postinstall.sh` §1g in arch-setup for
    # the install. Emergency recovery if wedged: `sudo escape-lock` from
    # SSH on a phone (NOPASSWD'd in /etc/sudoers.d/btop-lock).
    # Replaced physlock 2026-05-11 to make the lockscreen actually useful —
    # at-a-distance system stats instead of a blank prompt.
    #
    # `pidof btop-lock` guard prevents stacking lockscreens if hypridle
    # re-fires before the user has unlocked. The `sudo` is silent because
    # the sudoers entry NOPASSWD's it for tom.
    # unlock_cmd fires from the dbus Unlock signal that btop-lock emits via
    # `loginctl unlock-session` at the tail of its outer wrapper. Without
    # that signal the DPMS listener's on-resume only fires once Hyprland
    # itself sees input activity, leaving the TV showing "no signal" after
    # unlock until the user presses a key. The 0.5s sleep gives Hyprland
    # time to reacquire DRM master after the outer btop-lock's `chvt 1` —
    # without it, hyprctl can race the handoff and dpms-on no-ops.
    # waybar-healthcheck recovers from GTK3-waybar's lock/unlock failure
    # mode (process alive but surfaces detached from outputs); the restart
    # only fires when the probe actually reports broken state, so healthy
    # unlocks don't flicker.
    lock_cmd            = pidof btop-lock || sudo /usr/local/bin/btop-lock
    unlock_cmd          = sleep 0.5; hyprctl dispatch dpms on; ~/.local/bin/waybar-healthcheck || systemctl --user restart waybar.service; notify-send -t 1500 "unlocked"
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = hyprctl dispatch dpms on
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# 30 min idle → screen lock. kmscon takes the VT and runs btop. From there,
# kmscon's own `--dpms-timeout` (set in btop-lock) handles screen-off after
# another 30 min of in-lock idle — total 60 min wall-clock to DPMS-off, with
# wake-on-keypress restored by kmscon itself. Hyprland-side DPMS-off was
# removed 2026-05-21: it ran 2 min before lock, then kmscon inherited the
# DPMS-off state and couldn't wake (Hyprland had released DRM master), which
# trapped the user behind a dead panel after 18+ hours away.
listener {
    timeout       = 1800
    on-timeout    = loginctl lock-session
}
