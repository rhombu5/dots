# hypridle — idle action daemon. 30-min lock + DPMS-off per
# docs/desktop-requirements.md. No idle-hibernate (user invokes manually
# via Super+Shift+H or fuzzel control-panel).

general {
    # Lock via physlock — chvts to a free TTY, runs PAM auth there
    # (/etc/pam.d/physlock includes the in-session hyprlock stack:
    # finger / PIN / password). Hyprland keeps running on its own VT
    # untouched; on unlock physlock chvts back, session intact.
    # Replaced hyprlock 2026-05-05 to drop the graphical-lockscreen
    # dependency and unify the lock UX with TTY login.
    #
    # -d daemonizes so hypridle's process tree stays clean.
    # unlock_cmd dispatches dpms on because physlock takes input on a
    # different VT — Hyprland never sees the unlock, so the DPMS listener's
    # on-resume never fires. Without this, displays stay blanked after
    # unlock until something else (e.g. lid event) reconfigures monitors.
    lock_cmd            = pidof physlock || physlock -d
    unlock_cmd          = hyprctl dispatch dpms on; notify-send -t 1500 "unlocked"
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = hyprctl dispatch dpms on
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# 28 min idle → display power off (saves a couple minutes of backlight before lock)
listener {
    timeout       = 1680
    on-timeout    = hyprctl dispatch dpms off
    on-resume     = hyprctl dispatch dpms on
}

# 30 min idle → screen lock
listener {
    timeout       = 1800
    on-timeout    = loginctl lock-session
}
