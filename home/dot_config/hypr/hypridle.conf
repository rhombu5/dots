# hypridle — idle action daemon. 60-min lock, 90-min DPMS-off per
# docs/desktop-requirements.md. No idle-hibernate (user invokes manually
# via Super+Shift+H or fuzzel control-panel).

general {
    # Lock via tty-lock — a thin wrapper around physlock: blank VT, password
    # prompt, nothing else. physlock is setuid root, so no sudo and no sudoers
    # entry are involved.
    # Replaced btop-lock 2026-09-04. That ran kmscon on a spare VT to render
    # btop at 4K; on this clamshell setup (lid closed, only DP-1) kmscon's
    # redraw loop failed every frame with EINVAL — 372,754 "cannot swap display
    # [DP] -22" in 24h, ~10/sec throughout every lock, 98.6% of all journal
    # traffic. Fingerprint and PIN come back for free: physlock authenticates
    # through the normal PAM stack rather than the password-only
    # /etc/pam.d/btop-lock stanza pamtester used.
    #
    # `pidof physlock` guard prevents stacking lockscreens if hypridle re-fires
    # before the user has unlocked.
    # unlock_cmd fires from the dbus Unlock signal tty-lock emits via
    # `loginctl unlock-session` at its tail. Without that signal the DPMS
    # listener's on-resume only fires once Hyprland itself sees input activity,
    # leaving the TV showing "no signal" after unlock until the user presses a
    # key. The 0.5s sleep gives Hyprland time to reacquire DRM master after
    # physlock releases the VT — without it, hyprctl can race the handoff and
    # dpms-on no-ops.
    # waybar-healthcheck recovers from GTK3-waybar's lock/unlock failure mode
    # (process alive but surfaces detached from outputs); the restart only fires
    # when the probe actually reports broken state, so healthy unlocks don't
    # flicker.
    #
    # KNOWN REGRESSION: kmscon's --dpms-timeout=1800 used to blank the screen
    # after 30 min of in-lock idle. physlock has no equivalent, so the panel now
    # stays lit for as long as the session is locked. Hyprland-side dpms-off
    # can't substitute — it releases DRM master and traps the user behind a
    # dead panel (see the listener comment below).
    lock_cmd            = pidof physlock || ~/.local/bin/tty-lock
    unlock_cmd          = sleep 0.5; hyprctl dispatch dpms on; ~/.local/bin/waybar-healthcheck || systemctl --user restart waybar.service; notify-send -t 1500 "unlocked"
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = hyprctl dispatch dpms on
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
}

# 60 min idle → screen lock. kmscon takes the VT and runs btop. From there,
# kmscon's own `--dpms-timeout` (set in btop-lock) handles screen-off after
# another 30 min of in-lock idle — total 90 min wall-clock to DPMS-off, with
# wake-on-keypress restored by kmscon itself. Hyprland-side DPMS-off was
# removed 2026-05-21: it ran 2 min before lock, then kmscon inherited the
# DPMS-off state and couldn't wake (Hyprland had released DRM master), which
# trapped the user behind a dead panel after 18+ hours away.
listener {
    timeout       = 3600
    on-timeout    = loginctl lock-session
}
