# Startup — exec-once runs at session start; exec runs on every config reload.
#
# CAUTION: `exec-once` lines DO NOT serialize — they fire in parallel.
# Listing wallpaper-rotate first doesn't make Hyprland wait for it
# before starting waybar. Without an explicit delay, waybar can start
# while matugen is mid-write of colors.css, hit a partial file, and
# exit silently. Wrap waybar (and any matugen-CSS-importing daemon)
# in a 1.5s sleep so matugen's render completes first. Empirically
# matugen renders in <500ms, so 1.5s is comfortable headroom.
# (Fallback ~/.config/{waybar,swaync}/create_colors.css from chezmoi
# protects against the case where matugen fails entirely.)

# 0. Wire Hyprland into the user-systemd manager. Without this,
#    user services that gate on graphical-session.target (e.g.
#    tablet-mode-watcher.service, anything PartOf=graphical-session.target)
#    never start because no one ever activates the target.
#    - import-environment makes WAYLAND_DISPLAY/XDG_CURRENT_DESKTOP visible
#      to systemd --user and dbus, so subsequent unit activations inherit them.
#    - hyprland-session.target (shipped in dot_config/systemd/user/) BindsTo
#      graphical-session.target, so starting it activates both.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target

# 1. Initial wallpaper + matugen render — sets the colors.css files
#    everything else imports.
exec-once = ~/.local/bin/wallpaper-rotate --first

# 2. CSS-importing daemons. Sleep 1.5s lets matugen finish writing
#    colors.css before waybar/swaync try to read it.
#
# Before waybar starts: pill-accents.py extracts a Vibrant-style accent
# palette from each workspace's wallpaper (cached by image+mtime under
# ~/.cache/hyprmural) and writes ~/.config/themes/workspace-accents.css.
# waybar imports it via style.css. Cold cache: ~700ms per uncached image
# (one-time per wallpaper); warm: ~200ms total. SIGUSR2's waybar at the
# end so anyone running picks up the regen.
exec-once = ~/.config/hyprmural/pill-accents.py
exec-once = sh -c 'sleep 1.5 && exec waybar'
exec-once = sh -c 'sleep 1.5 && exec swaync'
# Wallpaper layer. hyprmural owns it: per-workspace static images via
# chezmoi-managed ~/.config/hyprmural/hyprmural.conf. Subscribes directly
# to socket2.sock for workspace events (no wpws daemon needed).
#
# Pre-hyprmural era: hyprlax painted parallax-stitched canvas, wpws
# daemon swapped images per workspace via awww. Both retired — see the
# disabled exec-once lines below.
# Full ~/.local/bin path required — Hyprland's exec env inherits greetd's
# PATH which omits ~/.local/bin (same gotcha as wpws/hyprpolkitagent below).
exec-once = ~/.local/bin/hyprmural
# exec-once = hyprlax --config ~/.config/hyprlax/hyprlax.toml
exec-once = wl-paste --watch cliphist store
exec-once = swayosd-server
exec-once = hypridle
# hyprpolkitagent: NOT spawned here. The Arch package ships the binary
# at /usr/lib/hyprpolkitagent/hyprpolkitagent (NOT on $PATH), so the
# previous bare `exec-once = hyprpolkitagent` silently no-op'd —
# Hyprland couldn't find the binary, no error surfaced. The systemd
# user unit `hyprpolkitagent.service` (WantedBy=graphical-session.target)
# is the right activation path; once §0 starts hyprland-session.target,
# the polkit agent unit auto-starts. Symptom of the bug: Bitwarden's
# "Unlock with system authentication" toggle silently clears (its pkexec
# hangs without an agent). Don't reintroduce the bare exec-once.
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service

# 3. 2-in-1 hardware
exec-once = iio-hyprland

# 3b. Per-workspace wallpaper + dynamic accent. Listens on Hyprland's
#    socket2.sock for workspacev2 / focusedmon events; on each, swaps
#    the wallpaper for the affected output (via awww), rewrites
#    ~/.config/themes/accent.{css,conf,ini}, and pushes Hyprland keyword
#    colors live (no reload). Owns the per-workspace fast path; matugen
#    still owns the full-theme slow path (~/.local/bin/wallpaper-rotate).
#    NB: must use the full ~/.local/bin/ path. Hyprland inherits PATH
#    from greetd's login session (`/usr/local/sbin:/usr/local/bin:/usr/bin:...`)
#    which does NOT include ~/.local/bin — a bare `wpws daemon` silently
#    no-ops at exec-once with no error surfaced (same gotcha that bit
#    hyprpolkitagent — see §2 above). The accent freezes on workspace
#    change because nothing is listening on socket2.sock.
# Retired with hyprmural — see §wallpaper layer above. wpws daemon also
# pushed per-workspace accent colors live (~/.config/themes/accent.*).
# That accent-update side-effect is *not* preserved here; matugen's
# colors.css from the last wallpaper-rotate is what waybar/hyprlock
# render until rewired. Re-enable wpws daemon (with awww calls patched
# out) if dynamic accents are wanted back.
# exec-once = ~/.local/bin/wpws daemon

# 3c. Initial lid-state sync. Hyprland's binddl fires on lid state CHANGES
#     (open ↔ close), so booting with the lid already closed leaves
#     eDP-1 enabled and the lid-handler never runs. This forces one
#     evaluation at startup so the boot-with-lid-closed case behaves
#     the same as closing the lid in-session.
exec-once = sh -c 'awk "/state/ {print \$2}" /proc/acpi/button/lid/*/state 2>/dev/null | grep -q closed && ~/.local/bin/lid-handler close'

# 3d. Display blackout watchdog. If we'd otherwise be left with no usable
#     display (last external unplugged or powered off while eDP-1 is
#     DPMS-off / disabled), recover based on lid state: lid open →
#     re-enable eDP-1, lid closed → hibernate. `hyprctl reload` re-applies
#     monitors.conf so a disabled (not just DPMS-off) eDP-1 comes back too.
#     See ~/.local/share/doc/display-watchdog/README.md.
exec-once = ~/.local/bin/display-watchdog --lid-open-action 'hyprctl reload && hyprctl dispatch dpms on eDP-1' --lid-closed-action 'systemctl hibernate'

# 4. Bitwarden — needs to be running for the SSH agent socket + tray icon.
#    Delayed past waybar's 1.5s start (see §2) so the SNI announce hits a
#    waybar that's already registered as StatusNotifierWatcher/Host.
#    Without the delay, Bitwarden announces tray icon to D-Bus before waybar
#    is listening, and the icon never appears in the bar.
exec-once = sh -c 'sleep 3.5 && exec bitwarden-desktop'

# 4b. Other SNI tray applets. Same SNI race as §4 — must register after
#     waybar is up, hence the sleep. blueman gives bluetooth GUI; udiskie
#     gives USB-mount notifications + tray.
exec-once = sh -c 'sleep 2.5 && exec blueman-applet'
exec-once = sh -c 'sleep 2.5 && exec udiskie --tray'

# 5. Hyprland plugins — enable + source per-plugin config inside the live
#    session. Plugins themselves were `hyprpm update`/`add`-built by
#    postinstall.sh §13's plugin block (eager, sudo-warm). Enabling has
#    to wait for a session, hence the runtime sourcing.
#
#    `exec` (not `exec-once`) is deliberate: `hyprctl reload` re-parses
#    hyprland.conf and discards any bindd lines previously injected via
#    `hyprctl keyword source post-plugins.d/*.conf` — so on reload the
#    Hyprspace overview bind would vanish until the next session. Re-
#    firing the script on each reload re-sources those configs and
#    re-registers the binds. Phases 1+2 (`hyprpm enable` / `hyprpm
#    reload`) are idempotent no-ops once plugins are loaded (~100ms).
exec = ~/.local/bin/hypr-plugins-on-login

# Restart waybar/swaync on Hyprland reload to pick up colors.conf changes
# (matugen post_hooks already do this, but on plain `hyprctl reload`
# without matugen, this catches our binds / decoration tweaks).
exec = pkill -SIGUSR2 waybar 2>/dev/null
