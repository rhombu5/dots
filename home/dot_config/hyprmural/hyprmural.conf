# hyprmural — per-workspace wallpaper mapping
#
# Format:
#   fit = cover|contain|stretch|center|tile
#   default = <path>                       # required; used when a workspace has no mapping
#   workspace = <id>, <path>               # optional, repeatable
#
# Workspace IDs may be integers or named (e.g. `special:scratchpad`).
# Tildes expand from $HOME.

fit = cover

# Run on each per-output image change with HYPRMURAL_MONITOR /
# HYPRMURAL_WORKSPACE / HYPRMURAL_IMAGE in the env. This script does
# Vibrant-style color extraction (cached by image+mtime) and pushes
# per-window bordercolor via setprop so each output gets its own
# accent. Bundled from hyprmural/examples/accent/.
hook = ~/.config/hyprmural/accent.py

default = ~/.local/share/wallpapers/HD wallpaper_ Linux, Tux, simple, minimalism.jpg

workspace = 1, ~/.local/share/wallpapers/arch_logos.png
workspace = 2, ~/.local/share/wallpapers/arch_logo_on_lightblue.png
workspace = 3, ~/.local/share/wallpapers/HD wallpaper_ Linux logo, minimalism, FoxyRiot, Tux, studio shot, communication.jpg
workspace = 4, ~/.local/share/wallpapers/arch_logo_on_clouds.webp
workspace = 5, ~/.local/share/wallpapers/i_use_arch_btw-prism.webp
workspace = 6, ~/.local/share/wallpapers/linux_terminal_wallpaper.png
workspace = 7, ~/.local/share/wallpapers/arch_logo_on_light.jpg
workspace = 8, ~/.local/share/wallpapers/i_use_arch_btw-logo.png
workspace = 9, ~/.local/share/wallpapers/archlinux_over_mountains.png
