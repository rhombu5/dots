# hyprmural — per-workspace wallpaper mapping
#
# Format:
#   fit = cover|contain|stretch|center|tile
#   default = <path>                # fallback when a workspace has no mapping
#   workspace = <id>, <path>        # optional, repeatable; explicit pin
#   randomize = true|false          # off by default
#   wallpaper_dir = <glob>          # repeatable; POSIX glob(3), ~ expanded
#   hook = <shell command>          # /bin/sh -c on each per-output image change
#
# When randomize is on, every workspace without an explicit mapping picks
# a random image from the wallpaper_dir pool at first sight and keeps it
# for the daemon's lifetime. Explicit `workspace = ` and `default = ` win.
#
# Workspace IDs may be integers or named (e.g. `special:scratchpad`).
# Tildes expand from $HOME.

fit = cover

# Hook chain — runs accent.py (per-window border colors) and
# pill-accents.py (waybar workspace pill colors) on every per-output
# image change. Both share a Vibrant cache keyed by image+mtime under
# $XDG_CACHE_HOME/hyprmural so successive reads are cheap.
hook = ~/.config/hyprmural/hook.sh

# Random per session, drawn from the entire wallpapers folder. New
# session → fresh shuffle. Within a session, each workspace's pick is
# stable (cached for the daemon's lifetime).
randomize = true
wallpaper_dir = ~/.local/share/wallpapers/*
