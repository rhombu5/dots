# Order waybar after hypr-plugins-on-login.service so the lid-closed
# clamshell branch (which disables eDP-1) has finished before waybar
# enumerates monitors. Reduces exposure to the upstream GdkMonitor UAF
# (Waybar #3530/#4361 family) that fires when an output is removed
# while waybar is mapping its bar — observed 2026-05-09 as
# `Bar::configureGlobalOffset` segfault following an eDP-1 yank during
# the boot-time SIGUSR2 reload.
[Unit]
Wants=hypr-plugins-on-login.service
After=hypr-plugins-on-login.service
