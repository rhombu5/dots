# Drop-in for upstream /usr/lib/systemd/user/waybar.service.
#
# Promotes waybar from the old
#     exec-once = sh -c 'sleep 1.5 && exec waybar'
# launch path to a managed user unit, motivated by six SIGSEGVs in 4
# days (2026-05-04 → 2026-05-08), all matching the GdkMonitor
# property-access UAF on output remove/re-add — the lifecycle race
# documented upstream as Waybar #3530 / #4361. Fixes for that class
# landed on master after 0.15.0 (#4938 / #4946 / #5007); a separate
# package switch may render this drop-in moot, but the auto-respawn
# behavior is worth keeping regardless.
#
# Overrides:
#   - Restart=on-failure → Restart=always (mirror hypridle drop-in
#     pattern from acfc277): silent gracefully-exited states must not
#     leave the bar dead until reboot.
#   - ExecStartPre=/bin/sleep 1.5 reproduces the old exec-once delay
#     so waybar reads matugen-rendered colors.css after the post_hook
#     write is complete (and after pill-accents.py's typical render).
#   - StartLimitBurst=5 / StartLimitIntervalSec=60 caps a flap loop.
#     If waybar fails 5 times in 60s, systemd gives up — manual
#     `systemctl --user start waybar.service` resumes it.
#   - ConditionEnvironment=WAYLAND_DISPLAY mirrors other units in this
#     repo (hyprmural, iio-hyprland, etc.); guards against starting
#     under a non-Wayland session.
[Unit]
ConditionEnvironment=WAYLAND_DISPLAY
StartLimitBurst=5
StartLimitIntervalSec=60

[Service]
ExecStartPre=/bin/sleep 1.5
Restart=always
RestartSec=2
