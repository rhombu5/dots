# Drop-in for upstream /usr/lib/systemd/user/waybar.service.
#
# Caps the waybar cgroup after two multi-GB leak incidents on the
# v0.15.0-173-g05945748 master build:
#   - 2026-07-07 01:53 — cgroup leaked to 10.1G swap; systemd-oomd
#     killed it (`Failed with result 'oom-kill'`) and restart.conf's
#     Restart=always respawned it cleanly.
#   - 2026-07-09 00:20 — the successor grew to ~6G RSS / 5.6G swap,
#     pushed system swap to 22G/25G, and swap-zombied the session:
#     layer surfaces timed out waiting for their initial .configure,
#     so reload keybinds looked dead and hyprmural lost its wallpaper
#     surfaces. Needed a manual restart to recover.
#
# Healthy waybar sits around 40-80M RSS at spawn. Which process inside
# the cgroup leaks (waybar proper vs glycin bwrap icon loaders vs the
# two swaync-client module processes) is unconfirmed — the
# waybar-mem-sampler timer records the per-PID ramp for attribution.
#
# The cap converts the leak into a ~2s bar blink: the kernel OOM-kills
# inside the cgroup at MemoryMax, OOMPolicy=kill promotes any such kill
# to whole-unit failure, and Restart=always respawns (the Jul 07
# incident proved the oom-kill → auto-restart path works). Swap is
# capped separately so a leaking bar can never zombie the whole session
# again.
[Service]
MemoryMax=512M
MemorySwapMax=256M
OOMPolicy=kill
