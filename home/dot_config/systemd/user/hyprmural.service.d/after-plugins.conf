# Order hyprmural after hypr-plugins-on-login.service so the lid-closed
# clamshell branch (which disables eDP-1) has finished before hyprmural
# binds to wl_output globals. Without this ordering, hyprmural sees
# eDP-1 briefly, gets a `wl_registry: error 0: global wl_output (NN)
# unavailable` when Phase 4 disables eDP-1 mid-startup, and survives
# without ever painting (observed 2026-05-09 fresh boot, lid closed).
[Unit]
Wants=hypr-plugins-on-login.service
After=hypr-plugins-on-login.service
