# Drop-in override for upstream /usr/lib/systemd/user/hypridle.service.
#
# Upstream uses Restart=on-failure. We override to Restart=always because
# observed 2026-05-08: hypridle disappeared silently mid-session — no
# coredump, no journal trail (it had been started as `exec-once` then,
# now via the unit). Whatever the exit signal/code was, an idle daemon
# should NEVER be in a "gracefully exited" state during a session: if
# it's gone, lock-on-idle silently stops working until next reboot.
# Restart=always covers exit(0) too; intentional `systemctl stop`
# bypasses restart, which is what we want.
[Service]
Restart=always
RestartSec=2
