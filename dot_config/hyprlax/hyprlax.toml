# hyprlax — parallax wallpaper config. Hand-tuned, chezmoi-managed.
#
# wpws no longer generates this file. wpws's job is to produce the
# stitched canvas at the path below (via `wpws stitch`) and to push
# per-workspace accent colors live; hyprlax is owned by exec-once and
# this file.
#
# Quick reload after editing:
#   pkill hyprlax; setsid -f hyprlax --config ~/.config/hyprlax/hyprlax.toml </dev/null >/dev/null 2>&1
[global]
fps = 60
duration = 0.3
easing = "expo"
# shift = 960
shift_percent = 11.11111

[global.parallax]
input = "workspace"

[[global.layers]]
path = "/home/tom/.cache/wpws/wide-handpicked-half.png"
# shift_multiplier = 1 #{ x = 0.5, y = 0 }
scale = 1.0
fit = "fit_height"
# align = { x = 0.0, y = 0.5 }
# uv_offsett = {x=0, y=0}


tile = {x = true, y = false}
# overflow = "none" #"repeat_x"