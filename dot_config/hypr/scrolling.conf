# Scrolling layout (Hyprland 0.54+ core) — config + bindings.
#
# Sourced from hyprland.conf at parse time (NOT from post-plugins.d/);
# scrolling is a core layout in Hyprland 0.54+, no plugin required.
# Activated via Super+Alt+S → ~/.local/bin/hypr-layout-toggle, which
# flips general:layout between dwindle and scrolling.
#
# Backstory (2026-04-30): we initially tried dawsers/hyprscroller —
# abandoned 2024, last commit literally "Last commit :-(". Pivoted to
# the official hyprwm/hyprscrolling plugin — also failed to build on
# Hyprland 0.54.3 because it #includes the obsolete IHyprLayout.hpp.
# Then discovered Hyprland 0.54 actually ABSORBED scrolling into core
# (algorithm/tiled/scrolling/ScrollingAlgorithm.cpp). The plugin's
# layoutmsg vocabulary (move/colresize/fit/focus/promote/swapcol/
# togglefit) is preserved verbatim by the core layout — verified
# against the source.

# Config keys live under the `scrolling` section and are registered
# directly by Hyprland (src/config/ConfigManager.cpp), not via plugin.
scrolling {
    # Default column width as a fraction of monitor width (0–1).
    # 0.5 = each column gets half the screen.
    column_width = 0.5

    # On a workspace with one column, render it fullscreen.
    # Off → keeps the column at column_width, leaves the rest blank.
    fullscreen_on_one_column = false

    # When a column gets focus, what method to bring it into view:
    #   0 = center the focused column
    #   1 = fit (least scroll needed)
    focus_fit_method = 0

    # When a window in another column is focused (e.g. via movefocus),
    # the layout scrolls horizontally to bring it into view.
    follow_focus = yes

    # Preset column widths for `colresize +conf` / `-conf` cycling.
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0

    # Scroll direction: "right" or "left" (which way new columns spawn).
    direction = right
}

# Bindings. None of these conflict with the dwindle stack — Super+Alt
# namespace, and layoutmsg silently no-ops in non-scrolling layouts.

# No dedicated column-shift binds — Super+left/right (movefocus l/r)
# already focuses the adjacent column in scrolling mode because
# `follow_focus = yes` scrolls the viewport to the focused window.

# Column-width presets (1/3, 1/2, 2/3, full) — match explicit_column_widths above.
bindd = $mainMod ALT, 1, Set column width to 1/3,           layoutmsg, colresize 0.333
bindd = $mainMod ALT, 2, Set column width to 1/2,           layoutmsg, colresize 0.5
bindd = $mainMod ALT, 3, Set column width to 2/3,           layoutmsg, colresize 0.667
bindd = $mainMod ALT, 4, Set column width to full,          layoutmsg, colresize 1.0
# Cycle through the preset widths above.
bindd = $mainMod ALT, W, Cycle column width preset,         layoutmsg, colresize +conf

# Promote the focused window to its own new column to the right.
bindd = $mainMod ALT, P, Promote window to its own column,  layoutmsg, promote

# Swap the focused column with its left/right neighbour. Wraps around.
bindd = $mainMod ALT, bracketleft,  Swap column with left neighbour,  layoutmsg, swapcol l
bindd = $mainMod ALT, bracketright, Swap column with right neighbour, layoutmsg, swapcol r

# Toggle the focus-fit method (center ↔ fit) for the active column.
bindd = $mainMod ALT, slash, Toggle column fit method (center/fit), layoutmsg, togglefit
