# hyprscroller (dawsers/hyprscroller) — scrolling layout.
#
# Sourced at runtime by ~/.local/bin/hypr-plugins-on-login AFTER
# `hyprpm enable scroller` succeeds. NOT sourced from hyprland.conf
# directly — Hyprland's initial parse would warn on `scroller:*`
# dispatchers when the plugin isn't yet loaded (and in some Hyprland
# versions raises the sticky red Configuration Errors overlay).
#
# Layout activation: Super+Alt+S toggles between dwindle and scroller
# (see binds.conf). Plain `movefocus l/r/u/d` and `movewindow l/r/u/d`
# work in both layouts — the plugin intercepts those when scroller is
# active. The bindings below are for scroller-specific operations that
# have no dwindle equivalent.

plugin {
    scroller {
        # Default column count for fit_size when no specific count given.
        column_default_width = onehalf

        # Whether to focus a window on workspace switch.
        focus_wrap = no

        # Cursor follows focus changes (default; matches dwindle behavior).
        cursor_follows_focus = yes
    }
}

# Scroller-specific bindings. None of these conflict with anything in the
# core dwindle stack — they're all in the Super+Alt namespace and either
# scroller-prefixed (no-op outside scroller mode anyway) or wrapped in
# ~/.local/bin/if-scrollmode for the universal-vocabulary cases.

# === Mode toggle (rows vs columns) =====================================
bind = $mainMod ALT, M, scroller:setmode, toggle

# === Fit-width: size active column to N columns ========================
# Day-1 useful for laptop-screen ergonomics — set width to 2 visible
# columns (most common), 1 for full-screen-column, 3 for tight packing.
bind = $mainMod ALT, 1, scroller:fitwidth, one
bind = $mainMod ALT, 2, scroller:fitwidth, two
bind = $mainMod ALT, 3, scroller:fitwidth, three
bind = $mainMod ALT, 4, scroller:fitwidth, four

# === Cycle column size (next/prev preset) ==============================
bind = $mainMod ALT, W, scroller:cyclesize, next

# === Admit / expel windows from / to neighboring columns ===============
# admit: pull the window from the next column into THIS column.
# expel: push the active window OUT of this column into a new one.
bind = $mainMod ALT, A, scroller:admitwindow,
bind = $mainMod ALT, X, scroller:expelwindow,

# === Alignment (within a column) =======================================
bind = $mainMod ALT, comma,  scroller:alignwindow, l
bind = $mainMod ALT, period, scroller:alignwindow, r
