# hyprwm/hyprscrolling — official Hyprland scrolling layout.
#
# Sourced at runtime by ~/.local/bin/hypr-plugins-on-login AFTER
# `hyprpm enable hyprscrolling` succeeds. NOT sourced from hyprland.conf
# directly — Hyprland's initial parse would warn on the layoutmsg-style
# bindings (`move`, `colresize`, etc.) when the plugin isn't yet loaded.
#
# Picked over dawsers/hyprscroller (abandoned 2024 — last commit literally
# titled "Last commit :-(", supports Hyprland up to 0.48.1 only). The
# hyprwm-maintained replacement supports 0.54.x and is actively chasing
# Hyprland HEAD. README says feature set is narrower (no overview / jump
# modes yet) — bindings below are the day-1 essentials; extend as the
# plugin grows.
#
# Layout activation: Super+Alt+S toggles dwindle ↔ scrolling (see binds.conf
# for the toggle bind, hypr-layout-toggle for the script).

plugin {
    hyprscrolling {
        # Default column width as a fraction of monitor width (0–1).
        # 0.5 = each column gets half the screen — natural for a 2-column
        # split. colresize bindings below cycle through 1/3, 1/2, 2/3, full.
        column_width = 0.5

        # On a workspace with one column, render it fullscreen (no wasted
        # space). Off → keeps the column at column_width, leaves the rest
        # blank. Off feels truer to the scrolling-layout model.
        fullscreen_on_one_column = false

        # When a column gets focus, what method to bring it into view:
        #   0 = center the focused column
        #   1 = fit (least scroll needed)
        focus_fit_method = 0

        # When a window in another column is focused (e.g. via movefocus),
        # the layout scrolls horizontally to bring it into view.
        follow_focus = yes

        # Preset column widths for `colresize +conf` / `-conf` cycling.
        explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    }
}

# Bindings. None of these conflict with the dwindle stack — they all live
# in the Super+Alt namespace and most are layoutmsg-routed (no-op silently
# in dwindle layout because dwindle's layout handler doesn't recognize
# the messages).

# Horizontal scroll by one column.
bind = $mainMod ALT, comma,  layoutmsg, move -col
bind = $mainMod ALT, period, layoutmsg, move +col

# Column-width presets (1/3, 1/2, 2/3, full) — match explicit_column_widths.
bind = $mainMod ALT, 1, layoutmsg, colresize 0.333
bind = $mainMod ALT, 2, layoutmsg, colresize 0.5
bind = $mainMod ALT, 3, layoutmsg, colresize 0.667
bind = $mainMod ALT, 4, layoutmsg, colresize 1.0
# Cycle through the preset widths above (forward / backward).
bind = $mainMod ALT, W, layoutmsg, colresize +conf

# Promote the focused window to its own new column to the right.
bind = $mainMod ALT, P, layoutmsg, promote

# Swap the focused column with its left/right neighbour. Wraps around.
bind = $mainMod ALT, bracketleft,  layoutmsg, swapcol l
bind = $mainMod ALT, bracketright, layoutmsg, swapcol r

# Toggle the focus-fit method (center ↔ fit) for the active column.
bind = $mainMod ALT, slash, layoutmsg, togglefit
