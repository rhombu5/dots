# hyprgrass (touch gesture engine for the 2-in-1).
#
# Sourced at runtime by the hyprpm bootstrap planter via
# `hyprctl keyword source ...` AFTER `hyprpm enable hyprgrass` succeeds.
# Skipped entirely (planter never sources this file) when the build
# fails — touch gestures are nice-to-have, not load-bearing, so a
# build failure on a Hyprland API bump shouldn't drag down anything else.
#
# Plugin block name is `touch_gestures` (NOT `hyprgrass`) per the
# upstream docs/configuration.md. Bindings use `hyprgrass-bind`
# keyword, NOT a `gestures { }` sub-block.

plugin {
    touch_gestures {
        sensitivity             = 1.0
        # 4-finger animated workspace swipe — mirrors the touchpad
        # `gesture = 4, horizontal, workspace` in input.conf so the 2-in-1
        # behaves the same regardless of which surface the user swipes.
        workspace_swipe_fingers = 4
        long_press_delay        = 400
        edge_margin             = 30
    }
}

# Edge-swipe up from bottom → toggle on-screen keyboard.
# `edge:<from_edge>:<direction>` — from_edge=d (down=bottom), direction=u (swipe up).
hyprgrass-bind = , edge:d:u, exec, pgrep -x wvkbd-mobintl >/dev/null && pkill wvkbd-mobintl || wvkbd-mobintl --hidden

# 3-finger l/r → browser back/forward (wtype Alt+Left/Right).
# Mirrors the touchpad bindings in input.conf.
hyprgrass-bind = , swipe:3:l, exec, wtype -M alt -k Left -m alt
hyprgrass-bind = , swipe:3:r, exec, wtype -M alt -k Right -m alt
