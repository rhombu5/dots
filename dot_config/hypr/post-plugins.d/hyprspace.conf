# Hyprspace (interactive workspace overview).
#
# Sourced at runtime by the hyprpm bootstrap dispatcher via
# `hyprctl keyword source ...` AFTER `hyprpm enable Hyprspace` succeeds.
# NOT sourced from hyprland.conf — see post-plugins.d/README rationale.
#
# Picked over hyprexpo for drag-window-between-workspaces support
# (`autoDrag` + `switchOnDrop`), which hyprexpo lacks.

plugin {
    overview {
        # Click anywhere on the panel — even on a window — initiates a drag.
        # Drop the window onto another workspace tile to move it there.
        autoDrag      = true
        # When a window is dropped onto a workspace, follow the window into
        # that workspace (don't stay on the source).
        switchOnDrop  = true
        # Click without drag exits the overview cleanly.
        exitOnClick   = true
        # Scroll on the panel pans through workspaces.
        autoScroll    = true

        # Panel chrome — tinted from matugen surface so it matches the rest
        # of the theme. $surface comes from ~/.config/hypr/colors.conf,
        # which Hyprland sources at parse time (matugen-rendered).
        panelColor       = $surface
        panelBorderColor = $surface_variant
        panelBorderWidth = 1
        workspaceActiveBackground   = $primary_container
        workspaceInactiveBackground = $surface_variant
    }
}

# Workspace overview toggle.
bind = $mainMod, grave, overview:toggle
