# Plugin-specific config lives in post-plugins.d/*.conf, sourced at
# runtime by `~/.local/bin/hypr-plugins` (called from postinstall.sh
# §plugins on first install, idempotent re-runs after a Hyprland
# update). The runtime sourcing pattern means Hyprland's initial config
# parse never references unloaded plugins, avoiding the sticky red
# 'Configuration Errors' overlay.
#
# Currently shipped:
#   - hyprgrass  (touch gesture engine; gestures in
#                post-plugins.d/hyprgrass.conf)
#   - Hyprspace  (workspace overview; built from the 0xl30/Hyprspace
#                fork because upstream KZDKM/Hyprspace HEAD crashes
#                Hyprland 0.54.3 on enable — issues #226/#227,
#                fix in open PR #229. Switch back when merged.
#                Config in post-plugins.d/hyprspace.conf.)
#
# Not a plugin (anymore): scrolling layout. Was tried as
# dawsers/hyprscroller (abandoned 2024) → hyprwm/hyprscrolling (also
# fails to build on 0.54.x — uses obsolete IHyprLayout.hpp). Then
# discovered Hyprland 0.54+ has scrolling AS A CORE LAYOUT — config
# section `scrolling { ... }` + the same layoutmsg vocabulary the
# plugin used. Wired natively in ~/.config/hypr/scrolling.conf.
#
# This file intentionally has no plugin {} blocks — they all live in
# post-plugins.d/<plugin>.conf instead.
