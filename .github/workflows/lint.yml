name: lint

# Static checks against the chezmoi source tree. Catches Hyprland
# binding conflicts (duplicate MOD+KEY, unknown dispatchers, malformed
# bindd descriptions) before they reach a fresh apply.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-hypr-binds:
    name: validate-hypr-binds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validator
        run: |
          chmod +x home/dot_local/bin/executable_validate-hypr-binds
          HYPR_DIR=home/dot_config/hypr \
            bash home/dot_local/bin/executable_validate-hypr-binds
